<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6 pb-20">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Top Bar -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
            <div>
                <h1 class="text-sm font-bold text-emerald-400">GURUKIRPA / ADMIN PANEL</h1>
                <p class="text-[10px] text-slate-400">Live Cloud Sync Active</p>
            </div>
            <div class="flex gap-2">
                <button id="refreshBtn" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-600">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh
                </button>
                <a href="../index.html" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-semibold border border-red-500/30">Logout</a>
            </div>
        </div>

        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Total Revenue</p>
                    <h2 id="totalRevenue" class="text-xl font-extrabold text-emerald-400 mt-1">₹0</h2>
                </div>
                <div class="bg-emerald-500/10 p-3 rounded-lg text-emerald-400 border border-emerald-500/20">
                    <i class="fa-solid fa-indian-rupee-sign text-lg"></i>
                </div>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Total Invoices</p>
                    <h2 id="totalInvoices" class="text-xl font-extrabold text-blue-400 mt-1">0</h2>
                </div>
                <div class="bg-blue-500/10 p-3 rounded-lg text-blue-400 border border-blue-500/20">
                    <i class="fa-solid fa-receipt text-lg"></i>
                </div>
            </div>
        </div>

        <!-- Live Invoices Section -->
        <div class="bg-slate-800 p-4 md:p-6 rounded-xl border border-slate-700 space-y-4 shadow-md">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-list-check mr-2"></i>Live Technician Invoices (Real-Time)</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-3">Customer Name</th>
                            <th class="p-3">Mobile</th>
                            <th class="p-3">Serial No.</th>
                            <th class="p-3">Total Amount</th>
                            <th class="p-3">TDS (In/Out)</th>
                        </tr>
                    </thead>
                    <tbody id="liveInvoiceTable" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">Loading live data from Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgIcBs725bsg2tdaEVK0NvUwe0axXR_Dc",
            authDomain: "gurukirpabilling.firebaseapp.com",
            projectId: "gurukirpabilling",
            storageBucket: "gurukirpabilling.appspot.com",
            messagingSenderId: "1071990543119",
            appId: "1:1071990543119:web:f3ee130c3556194814a47a",
            measurementId: "G-S5N42DJ02Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadInvoices() {
            let tbody = document.getElementById('liveInvoiceTable');
            let revCard = document.getElementById('totalRevenue');
            let countCard = document.getElementById('totalInvoices');

            tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Fetching live data...</td></tr>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "invoices"));
                tbody.innerHTML = "";
                
                if(querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No invoices generated yet.</td></tr>`;
                    revCard.innerText = "₹0";
                    countCard.innerText = "0";
                    return;
                }

                let totalRev = 0;
                let count = 0;

                querySnapshot.forEach((doc) => {
                    let inv = doc.data();
                    let amt = Number(inv.grandTotal) || 0;
                    totalRev += amt;
                    count++;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="p-3 font-medium text-white">${inv.customerName || 'N/A'}</td>
                            <td class="p-3 text-slate-300">${inv.customerMobile || 'N/A'}</td>
                            <td class="p-3 text-slate-300">${inv.machineSerial || 'N/A'}</td>
                            <td class="p-3 text-emerald-400 font-bold">₹${amt.toLocaleString('en-IN')}</td>
                            <td class="p-3 text-slate-300">${inv.tdsIn || 0} / ${inv.tdsOut || 0} PPM</td>
                        </tr>
                    `;
                });

                revCard.innerText = "₹" + totalRev.toLocaleString('en-IN');
                countCard.innerText = count;

            } catch (e) {
                console.error("Error loading invoices: ", e);
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Error connecting to database.</td></tr>`;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadInvoices);
        loadInvoices();
    </script>
</body>
</html>
