<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Top Bar -->
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
                <h1 class="text-lg font-bold text-emerald-400">GURUKIRPA / ADMIN PANEL</h1>
                <p class="text-xs text-slate-400">Live Cloud Sync Enabled</p>
            </div>
            <a href="../index.html" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-semibold border border-red-500/30">Logout</a>
        </div>

        <!-- Live Invoices Section -->
        <div class="bg-slate-800 p-4 md:p-6 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-receipt mr-2"></i>Live Technician Invoices (Real-Time)</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-3">Customer Name</th>
                            <th class="p-3">Mobile</th>
                            <th class="p-3">Serial No.</th>
                            <th class="p-3">Total Amount</th>
                            <th class="p-3">TDS (In/Out)</th>
                        </tr>
                    </thead>
                    <tbody id="liveInvoiceTable" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">Loading live data from Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgIcBs725bsg2tdaEVK0NvUwe0axXR_Dc",
            authDomain: "gurukirpabilling.firebaseapp.com",
            projectId: "gurukirpabilling",
            storageBucket: "gurukirpabilling.appspot.com",
            messagingSenderId: "1071990543119",
            appId: "1:1071990543119:web:f3ee130c3556194814a47a",
            measurementId: "G-S5N42DJ02Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadInvoices() {
            let tbody = document.getElementById('liveInvoiceTable');
            try {
                const querySnapshot = await getDocs(collection(db, "invoices"));
                tbody.innerHTML = "";
                if(querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No invoices generated yet.</td></tr>`;
                    return;
                }
                querySnapshot.forEach((doc) => {
                    let inv = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td class="p-3 font-medium">${inv.customerName || 'N/A'}</td>
                            <td class="p-3 text-slate-400">${inv.customerMobile || 'N/A'}</td>
                            <td class="p-3">${inv.machineSerial || 'N/A'}</td>
                            <td class="p-3 text-emerald-400 font-bold">₹${inv.grandTotal || '2150'}</td>
                            <td class="p-3">${inv.tdsIn || 0} / ${inv.tdsOut || 0} PPM</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Error loading invoices: ", e);
            }
        }

        loadInvoices();
    </script>
</body>
</html>
