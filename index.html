<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa Water Filter - Pro Billing & CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400 tracking-wide">GURUKIRPA / NEERVEDA</h1>
                <p class="text-xs text-slate-400">Smart RO Control, AC Service & Professional Billing</p>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('billing')" id="tab-billing-btn" class="bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Billing</button>
                <button onclick="switchTab('dashboard')" id="tab-dashboard-btn" class="bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Dashboard</button>
                <button onclick="switchTab('inventory')" id="tab-inventory-btn" class="bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Stock</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-2">

        <!-- BILLING SECTION -->
        <div id="section-billing" class="space-y-6">
            
            <!-- Customer Details Card -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                <h2 class="text-sm font-semibold text-emerald-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-user-gear mr-2"></i>Customer & Machine Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400">Customer Name</label>
                        <input type="text" id="custName" placeholder="Enter Name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Mobile Number</label>
                        <input type="tel" id="custMobile" placeholder="10-digit number" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Machine Serial Code / Barcode</label>
                        <div class="flex gap-2 mt-1">
                            <input type="text" id="machineSerial" placeholder="Scan or Enter Serial No." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                            <button onclick="alert('Camera Barcode Scanner Activated')" class="bg-slate-700 px-3 rounded-lg text-emerald-400 hover:bg-slate-600"><i class="fa-solid fa-barcode"></i></button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Service Type</label>
                        <select id="serviceType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 outline-none mt-1">
                            <option>New RO Sale & Installation</option>
                            <option>Routine Service / AMC Visit</option>
                            <option>Repair & Part Replacement</option>
                            <option>AC Service & Gas Refilling</option>
                            <option>Kangen / Alkaline System</option>
                        </select>
                    </div>
                </div>

                <!-- TDS & Technician Log -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 pt-3 border-t border-slate-700/50">
                    <div>
                        <label class="text-xs text-slate-400">Raw Water TDS</label>
                        <input type="number" id="tdsIn" placeholder="e.g. 650" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Purified TDS</label>
                        <input type="number" id="tdsOut" placeholder="e.g. 50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Assigned Technician</label>
                        <select id="technician" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
                            <option>Self (Shop Owner)</option>
                            <option>Technician 1</option>
                            <option>Technician 2</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">AMC Status</label>
                        <select id="amcStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
                            <option>None / Standard</option>
                            <option>1 Year AMC Active</option>
                            <option>2 Years AMC Active</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Spare Parts & Service List -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                <h2 class="text-sm font-semibold text-emerald-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-boxes-stacked mr-2"></i>Parts & Service List (Custom Pricing)</h2>
                
                <div class="space-y-3" id="itemsContainer">
                    <!-- Dynamic Item Rows generated via JS -->
                </div>

                <button onclick="addNewItemRow()" class="mt-3 text-xs bg-slate-700 hover:bg-slate-600 text-emerald-400 px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Custom Part / Service
                </button>
            </div>

            <!-- Calculation & Checkout Footer -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Subtotal:</span>
                    <span id="subTotalDisplay" class="font-semibold text-white">₹0</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Discount / Extra (₹):</span>
                    <input type="number" id="discountInput" value="0" oninput="calculateTotal()" class="w-24 bg-slate-900 border border-slate-700 rounded p-1 text-right text-sm text-white">
                </div>
                <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-700">
                    <span class="font-bold text-emerald-400">Grand Total:</span>
                    <span id="grandTotalDisplay" class="text-lg font-bold text-emerald-400">₹0</span>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button onclick="checkout('Cash')" class="bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-lg text-xs font-semibold">Cash</button>
                    <button onclick="checkout('UPI')" class="bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-lg text-xs font-semibold">UPI / QR</button>
                    <button onclick="checkout('Udhar')" class="bg-amber-600 hover:bg-amber-500 text-slate-950 py-2.5 rounded-lg text-xs font-semibold">Pending (Udhar)</button>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="printBill()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-print"></i> Print Receipt
                    </button>
                    <button onclick="sendWhatsApp()" class="bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp"></i> Send WhatsApp Bill
                    </button>
                </div>
            </div>

        </div>

        <!-- DASHBOARD SECTION -->
        <div id="section-dashboard" class="hidden space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-sm font-semibold text-emerald-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-chart-line mr-2"></i>Business Overview (Today)</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                        <p class="text-xs text-slate-400">Total Sales Today</p>
                        <p class="text-xl font-bold text-emerald-400 mt-1">₹4,850</p>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                        <p class="text-xs text-slate-400">Pending Payments</p>
                        <p class="text-xl font-bold text-amber-400 mt-1">₹1,200</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- INVENTORY SECTION -->
        <div id="section-inventory" class="hidden space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-sm font-semibold text-emerald-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-warehouse mr-2"></i>Live Stock & Inventory</h2>
                <div id="stockListContainer" class="space-y-2">
                    <!-- Stock items populated via JS -->
                </div>
            </div>
        </div>

    </main>

    <script>
        // Initial Inventory & Parts List
        let stockItems = [
            { id: 1, name: "Spun Filter (Sediment 10\")", price: 150, qty: 15 },
            { id: 2, name: "Carbon Filter (CTO/GAC)", price: 250, qty: 10 },
            { id: 3, name: "RO Membrane (75/100 GPD)", price: 1200, qty: 8 },
            { id: 4, name: "RO Booster Pump (100 GPD)", price: 1800, qty: 5 },
            { id: 5, name: "SMPS Power Adapter (24V/36V)", price: 450, qty: 12 },
            { id: 6, name: "SV (Solenoid Valve)", price: 250, qty: 20 },
            { id: 7, name: "Alkaline / Copper Filter", price: 800, qty: 6 },
            { id: 8, name: "AC General Service & Checkup", price: 599, qty: 99 }
        ];

        function initBillingItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            stockItems.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-700/60 gap-2">
                        <div class="flex-1">
                            <p class="text-xs font-medium text-white">${item.name}</p>
                            <span class="text-[10px] text-slate-400">Stock: ${item.qty} left</span>
                        </div>
                        <div class="w-20">
                            <input type="number" id="price_${index}" value="${item.price}" oninput="calculateTotal()" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-center text-emerald-400 font-semibold">
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="updateQty(${index}, -1)" class="bg-slate-800 hover:bg-slate-700 w-6 h-6 rounded text-xs text-white font-bold">-</button>
                            <input type="number" id="qty_${index}" value="0" oninput="calculateTotal()" class="w-10 bg-slate-800 border border-slate-700 rounded p-1 text-xs text-center text-white">
                            <button onclick="updateQty(${index}, 1)" class="bg-slate-800 hover:bg-slate-700 w-6 h-6 rounded text-xs text-white font-bold">+</button>
                        </div>
                    </div>
                `;
            });
            calculateTotal();
            renderStock();
        }

        function updateQty(index, change) {
            let qtyInput = document.getElementById(`qty_${index}`);
            let val = parseInt(qtyInput.value) || 0;
            val = Math.max(0, val + change);
            qtyInput.value = val;
            calculateTotal();
        }

        function calculateTotal() {
            let subtotal = 0;
            stockItems.forEach((item, index) => {
                let q = parseInt(document.getElementById(`qty_${index}`).value) || 0;
                let p = parseFloat(document.getElementById(`price_${index}`).value) || 0;
                subtotal += q * p;
            });
            let discount = parseFloat(document.getElementById('discountInput').value) || 0;
            let grandTotal = Math.max(0, subtotal - discount);

            document.getElementById('subTotalDisplay').innerText = `₹${subtotal}`;
            document.getElementById('grandTotalDisplay').innerText = `₹${grandTotal}`;
        }

        function addNewItemRow() {
            let name = prompt("Enter Custom Part / Service Name:");
            let price = prompt("Enter Price (₹):", "300");
            if(name && price) {
                stockItems.push({ id: stockItems.length + 1, name: name, price: parseFloat(price), qty: 10 });
                initBillingItems();
            }
        }

        function renderStock() {
            const container = document.getElementById('stockListContainer');
            container.innerHTML = '';
            stockItems.forEach(item => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-xs">
                        <span class="text-white font-medium">${item.name}</span>
                        <div class="flex gap-4">
                            <span class="text-emerald-400">₹${item.price}</span>
                            <span class="bg-slate-800 px-2 py-0.5 rounded text-slate-300">Stock: ${item.qty}</span>
                        </div>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            ['billing', 'dashboard', 'inventory'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
        }

        function checkout(mode) {
            let name = document.getElementById('custName').value || "Customer";
            alert(`Bill successfully saved with payment mode: ${mode} for ${name}! Stock auto-deducted.`);
        }

        function printBill() {
            window.print();
        }

        function sendWhatsApp() {
            let phone = document.getElementById('custMobile').value;
            let name = document.getElementById('custName').value || "Customer";
            let total = document.getElementById('grandTotalDisplay').innerText;
            let msg = encodeURIComponent(`Hello ${name}, thanks for choosing GuruKirpa Water Filter & AC Service. Your total bill amount is ${total}. Visit again!`);
            if(phone) {
                window.open(`https://wa.me/91${phone}?text=${msg}`, '_blank');
            } else {
                alert("Please enter customer mobile number first!");
            }
        }

        window.onload = initBillingItems;
    </script>
</body>
</html>
