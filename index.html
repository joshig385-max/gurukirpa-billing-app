<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-80 shadow-lg">
        <h1 class="text-xl font-bold text-emerald-400 text-center mb-1">GURUKIRPA</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Smart Billing & Service Portal</p>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs text-slate-400">Select Role / User ID</label>
                <select id="loginRole" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white mt-1 outline-none focus:border-emerald-500">
                    <option value="admin">Admin (Gaurav Kumar)</option>
                    <option value="tech1">Technician (Rohit Kumar)</option>
                    <option value="tech2">Technician (Staff 2)</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400">Password / PIN</label>
                <input type="password" id="loginPin" placeholder="Enter 4-digit PIN" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white mt-1 outline-none focus:border-emerald-500">
            </div>
            <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
                Login to Portal
            </button>
        </div>
    </div>

    <script>
        function handleLogin() {
            let role = document.getElementById('loginRole').value;
            if(role === 'admin') {
                window.location.href = 'admin/dashboard.html';
            } else {
                window.location.href = 'technician/billing.html';
            }
        }
    </script>
</body>
</html>
