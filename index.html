<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Water Filter & AC Service ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#1c2541] p-8 rounded-2xl border border-slate-800 shadow-xl space-y-6 text-center">
        
        <!-- Logo & Branding -->
        <div class="space-y-2">
            <div class="bg-emerald-500/20 text-emerald-400 w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-2xl border border-emerald-500/30 shadow-inner">
                <i class="fa-solid fa-droplet"></i>
            </div>
            <h1 class="text-xl font-extrabold text-white">GuruKirpa</h1>
            <p class="text-xs text-slate-400">Water Filter & AC Service Management</p>
        </div>

        <!-- Role Selection Buttons -->
        <div class="space-y-3 pt-2">
            <a href="admin/dashboard.html" class="w-full flex items-center justify-between bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-4 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-user-shield text-base"></i><span>Login as Admin</span></span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="technician/billing.html" class="w-full flex items-center justify-between bg-slate-900 hover:bg-slate-800 text-emerald-400 font-bold p-4 rounded-xl text-xs border border-slate-700 transition">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-screwdriver-wrench text-base"></i><span>Login as Technician</span></span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="pt-4 border-t border-slate-800 text-[10px] text-slate-500">
            Cloud Connected ERP System • Version 1.0
        </div>
    </div>

</body>
</html>
