<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Technician Billing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-sm font-bold text-emerald-400">GURUKIRPA / TECHNICIAN PORTAL</h1>
            <p class="text-[10px] text-slate-400">Logged in as: Rohit Kumar</p>
        </div>
        <a href="../index.html" class="bg-red-500/20 text-red-400 px-3 py-1 rounded text-xs font-semibold border border-red-500/30">Logout</a>
    </header>

    <main class="max-w-3xl mx-auto p-4 space-y-4">
        
        <!-- Customer Details -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-user mr-1"></i>Customer Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="custName" placeholder="Customer Name" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
                <input type="tel" id="custMobile" placeholder="Mobile Number" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
            </div>
            <input type="text" id="machineSerial" placeholder="Machine Serial No. / Barcode" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
        </div>

        <!-- TDS Water Log -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-droplet mr-1"></i>Water TDS Quality Log</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-slate-400">Inflow TDS (Raw)</label>
                    <input type="number" id="tdsIn" placeholder="e.g. 356" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">Outflow TDS (Purified)</label>
                    <input type="number" id="tdsOut" placeholder="e.g. 28" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white mt-1">
                </div>
            </div>
        </div>

        <!-- Parts List -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-box mr-1"></i>Parts & Services</h2>
            
            <div class="space-y-2">
                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-700 text-xs">
                    <span>RO Service (General)</span>
                    <div class="flex items-center gap-3">
                        <span class="text-emerald-400 font-semibold">₹600</span>
                        <input type="number" value="1" class="w-10 bg-slate-800 border border-slate-700 rounded text-center text-white p-1">
                    </div>
                </div>
                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-700 text-xs">
                    <span>Sediment Filter</span>
                    <div class="flex items-center gap-3">
                        <span class="text-emerald-400 font-semibold">₹150</span>
                        <input type="number" value="1" class="w-10 bg-slate-800 border border-slate-700 rounded text-center text-white p-1">
                    </div>
                </div>
                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-700 text-xs">
                    <span>RO Membrane 80 GPD</span>
                    <div class="flex items-center gap-3">
                        <span class="text-emerald-400 font-semibold">₹1200</span>
                        <input type="number" value="1" class="w-10 bg-slate-800 border border-slate-700 rounded text-center text-white p-1">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Checkout Bar -->
    <div class="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-700 p-3 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-[10px] text-slate-400">Grand Total (Incl. GST)</p>
                <p class="text-base font-bold text-emerald-400">₹2,150</p>
            </div>
            <div class="flex gap-2">
                <button onclick="alert('Invoice Saved & Sent to Admin!')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition">
                    Save & Print Bill
                </button>
            </div>
        </div>
    </div>

</body>
</html>
