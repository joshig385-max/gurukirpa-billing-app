<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Technician Billing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-[#1c2541] border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-droplet text-emerald-400"></i>
            <div>
                <h1 class="text-xs font-bold text-white">GURUKIRPA / TECHNICIAN PORTAL</h1>
                <p class="text-[10px] text-slate-400">Cloud Connected</p>
            </div>
        </div>
        <a href="../admin/dashboard.html" class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-lg text-xs font-semibold border border-emerald-500/30">Admin Panel</a>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        
        <!-- Customer Details -->
        <div class="bg-[#1c2541] p-4 rounded-2xl border border-slate-800 space-y-3 shadow-sm">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-user mr-1"></i>Customer Details</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" id="custName" placeholder="Customer Name" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                <input type="tel" id="custMobile" placeholder="Mobile Number" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <input type="text" id="machineSerial" placeholder="Machine Serial No. / Barcode" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Water TDS Quality Log -->
        <div class="bg-[#1c2541] p-4 rounded-2xl border border-slate-800 space-y-3 shadow-sm">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-droplet mr-1"></i>Water TDS Quality Log</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-slate-400">Inflow TDS (Raw)</label>
                    <input type="number" id="tdsIn" placeholder="e.g. 356" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">Outflow TDS (Purified)</label>
                    <input type="number" id="tdsOut" placeholder="e.g. 28" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white mt-1 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
        </div>

        <!-- Bill Amount Input -->
        <div class="bg-[#1c2541] p-4 rounded-2xl border border-slate-800 space-y-3 shadow-sm">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-indian-rupee-sign mr-1"></i>Service & Parts Total</h2>
            <div>
                <label class="text-[10px] text-slate-400">Total Bill Amount (₹)</label>
                <input type="number" id="billAmount" value="2150" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm font-bold text-emerald-400 mt-1 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

    </main>

    <!-- Bottom Checkout Bar -->
    <div class="fixed bottom-0 left-0 w-full bg-[#1c2541] border-t border-slate-800 p-3 shadow-lg z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center px-4">
            <div>
                <p class="text-[10px] text-slate-400">Grand Total (Incl. GST)</p>
                <p id="displayTotal" class="text-base font-bold text-emerald-400">₹2,150</p>
            </div>
            <button id="saveBtn" type="button" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                Save & Sync to Cloud
            </button>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgIcBs725bsg2tdaEVK0NvUwe0axXR_Dc",
            authDomain: "gurukirpabilling.firebaseapp.com",
            projectId: "gurukirpabilling",
            storageBucket: "gurukirpabilling.appspot.com",
            messagingSenderId: "1071990543119",
            appId: "1:1071990543119:web:f3ee130c3556194814a47a",
            measurementId: "G-S5N42DJ02Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const amountInput = document.getElementById('billAmount');
        const displayTotal = document.getElementById('displayTotal');

        amountInput.addEventListener('input', function() {
            let val = amountInput.value || 0;
            displayTotal.innerText = "₹" + Number(val).toLocaleString('en-IN');
        });

        document.getElementById('saveBtn').addEventListener('click', async function() {
            let name = document.getElementById('custName').value.trim();
            let mobile = document.getElementById('custMobile').value.trim();
            let serial = document.getElementById('machineSerial').value.trim();
            let tdsIn = document.getElementById('tdsIn').value.trim();
            let tdsOut = document.getElementById('tdsOut').value.trim();
            let finalAmount = Number(amountInput.value) || 0;

            if(!name || !mobile) {
                alert("Please enter customer name and mobile number!");
                return;
            }

            try {
                this.innerText = "Saving...";
                await addDoc(collection(db, "invoices"), {
                    customerName: name,
                    customerMobile: mobile,
                    machineSerial: serial || 'N/A',
                    tdsIn: tdsIn || '0',
                    tdsOut: tdsOut || '0',
                    grandTotal: finalAmount,
                    createdAt: new Date().toISOString()
                });
                alert("Invoice Saved Successfully to Cloud!");
                document.getElementById('custName').value = '';
                document.getElementById('custMobile').value = '';
                document.getElementById('machineSerial').value = '';
                document.getElementById('tdsIn').value = '';
                document.getElementById('tdsOut').value = '';
                amountInput.value = '2150';
                displayTotal.innerText = '₹2,150';
                this.innerText = "Save & Sync to Cloud";
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error saving invoice: " + e.message);
                this.innerText = "Save & Sync to Cloud";
            }
        });
    </script>
</body>
</html>
