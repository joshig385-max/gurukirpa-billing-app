<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuruKirpa - Technician Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6">
    <div class="max-w-md mx-auto bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h1 class="text-lg font-bold text-emerald-400 mb-3">Technician Billing Portal</h1>
        <p class="text-xs text-slate-400 mb-4">Yahan technician sirf apna bill generate karega jo seedha admin ke paas sync hoga.</p>
        <input type="text" placeholder="Customer Name" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm mb-3 text-white">
        <input type="tel" placeholder="Mobile Number" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm mb-3 text-white">
        <button class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded text-sm">Create Invoice</button>
    </div>
</body>
</html>
